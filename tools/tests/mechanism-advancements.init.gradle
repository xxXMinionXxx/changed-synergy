gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/mechanism-advancements-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/mechanism-advancements'))
        project.tasks.named('compileJava').configure {
            source project.file('tools/tests/negotiation-lifecycle/net/parkabird/changedsynergy/regression/SilkAndPunishmentRegression.java')
        }
    }
}
