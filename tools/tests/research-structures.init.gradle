gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/research-structures-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/research-structures'))
        def classes = project.file('.codex-tmp/research-structures-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs = project.files(classes)
        project.tasks.named('compileJava').configure { destinationDirectory.set(classes) }
        project.tasks.register('researchClasspath') {
            doLast { println('RESEARCH_CP=' + project.sourceSets.main.compileClasspath.asPath) }
        }
    }
}
