// Private boarding assertions and optional-API contract double, excluded from releases.
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/companion-seating-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/companion-seating'))
        def classes = project.file('.codex-tmp/companion-seating-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs = project.files(classes)
        project.tasks.named('compileJava').configure { destinationDirectory.set(classes) }
    }
}
