// Private failed-route assertions, excluded from the release JAR.
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/task-navigation-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/task-navigation'))
        def classes = project.file('.codex-tmp/task-navigation-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs = project.files(classes)
        project.tasks.named('compileJava').configure { destinationDirectory.set(classes) }
    }
}
