// Private real-container checks; never included in the distributed JAR.
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/cache-access-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/cache-access'))
        def classes = project.file('.codex-tmp/cache-access-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs = project.files(classes)
        project.tasks.named('compileJava').configure { destinationDirectory.set(classes) }
    }
}
