// Isolated registration, player-form and client-render checks for Latex Silk Moth.
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/silk-moth-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/silk-moth'))
        def classes = project.file('.codex-tmp/silk-moth-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs = project.files(classes)
        project.tasks.named('compileJava').configure { destinationDirectory.set(classes) }
        project.minecraft.runs.server.workingDirectory project.file('.codex-tmp/silk-moth-server')
        project.minecraft.runs.server.property 'forge.logging.console.level', 'info'
        project.minecraft.runs.server.property 'silkmoth.server.regression', 'true'
        project.minecraft.runs.client.workingDirectory project.file('.codex-tmp/silk-moth-client')
        project.minecraft.runs.client.property 'forge.logging.console.level', 'info'
        project.minecraft.runs.client.property 'silkmoth.client.regression', 'true'
        project.minecraft.runs.client.args '--width', '1100', '--height', '800'
    }
}
