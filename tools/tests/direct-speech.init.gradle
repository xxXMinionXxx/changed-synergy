// Private production-server assertions; never included in release artifacts.
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/direct-speech-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/direct-speech'))
        def classes = project.file('.codex-tmp/direct-speech-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs = project.files(classes)
        project.tasks.named('compileJava').configure { destinationDirectory.set(classes) }
    }
}
