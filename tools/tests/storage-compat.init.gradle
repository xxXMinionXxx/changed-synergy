// Focused production-server storage checks, excluded from release artifacts.
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(project.file('.codex-tmp/storage-compat-build'))
    project.afterEvaluate {
        project.sourceSets.main.java.srcDir(project.file('tools/tests/storage-compat'))
        def classes = project.file('.codex-tmp/storage-compat-build/classes/java/main')
        project.sourceSets.main.java.destinationDirectory.set(classes)
        project.sourceSets.main.output.classesDirs = project.files(classes)
        project.tasks.named('compileJava').configure {
            destinationDirectory.set(classes)
            source project.file('tools/tests/negotiation-lifecycle/net/parkabird/changedsynergy/regression/OutpostStorageRegression.java')
        }
    }
}
